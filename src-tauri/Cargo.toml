[package]
name = "crypto-tool"
version = "1.2.0"
edition = "2021"

[lib]
name = "crypto_tool_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "crypto-tool"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
aes-gcm = "0.10"
sha2 = "0.10"
md-5 = "0.10"
blake2 = "0.10"
crc32fast = "1.4"
rand = "0.8"
hex = "0.4"
rfd = "0.15"
